name: daily

on:
  schedule:
    - cron: "0 23 * * *"  # 毎朝 8:00 (日本時間)
  workflow_dispatch:       # 手動実行用

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: まとめサイトを確認して通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pokeca_notifier.py
      - name: 状態と一覧ページを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/ || true
          git diff --cached --quiet || git commit -m "Update $(TZ=Asia/Tokyo date +%F)"
          git push
